<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ریاضی — اپ آموزش و آزمون</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/style.css">
<style>
.grade{margin-bottom:26px}
.grade h2{font-size:1.15rem;color:#fbbf24;margin:14px 4px 8px}
.chap{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid rgba(99,102,241,.25);border-right:4px solid var(--pr);border-radius:14px;padding:14px 16px;margin:8px 0;transition:.15s}
.chap:hover{transform:translateY(-2px);border-color:#818cf8}
.chap b{font-size:1.05rem}
.chap span{display:block;color:var(--mu);font-size:.9rem}
.chap .tp-line{margin-top:6px;font-size:.8rem;color:#a5b4fc}
.hero{background:var(--gr);border-radius:20px;padding:26px;text-align:center;margin-bottom:8px}
.hero h1{color:#fff;-webkit-text-fill-color:#fff}
.hero p{color:rgba(255,255,255,.9)}
</style>
</head>
<body>
<div class="wrap">
 <div class="hero"><h1>📐 اپ ریاضی</h1><p>آموزش تعاملی + آزمون هوشمند + پیگیری پیشرفت</p></div>
 <div id="app"><p style="text-align:center;color:var(--mu)">در حال بارگذاری…</p></div>
</div>
<script>
const FA=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
(async()=>{let C;try{C=await (await fetch('chapters.json')).json()}catch(e){document.getElementById('app').innerHTML='<div class="tip">فایل chapters.json پیدا نشد.</div>';return}
 const g2=Object.fromEntries(C.grades.map(g=>[g.n,g.t]));
 document.getElementById('app').innerHTML=C.grades.map(g=>`<div class="grade"><h2>${g.t}</h2>${g.chapters.map(c=>`<a class="chap" href="${c.url}"><b>${c.title} — ${c.sub}</b><span>درس‌نامه، ابزارهای تعاملی، آزمون و بازی</span><div class="tp-line">${Object.values(c.topics||{}).slice(0,8).join(' • ')}</div></a>`).join('')}</div>`).join('');})();
</script>
</body>
</html>
